services:
  mysql:
    image: mysql:5.7
    container_name: mysql_container
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    networks:
      - app_network

  app:
    build: .
    volumes:
      - .:/home/node/app
    ports:
      - '8686:8686'
    env_file:
      - ./.env
    depends_on:
      - mysql
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
