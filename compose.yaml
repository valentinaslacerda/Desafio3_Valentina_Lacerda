services:
  mysql:
    image: mysql:5.7
    container_name: mysql_container
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - '3306:3306'

  app:
    build: .
    volumes:
      - .:/home/node/app
    ports:
      - '8686:8686'
    env_file:
      - ./.env
    depends_on:
      - mysql